[alias]
sanity-gtest = "test -p duniter-live-tests --test sanity_gtest -- --nocapture"
tu = "test --workspace --exclude g1-runtime --exclude duniter-end2end-tests --exclude duniter-live-tests --features constant-fees,fast" # Gtest unit tests with constant fees and fast timings
tf = "test --workspace --exclude g1-runtime --exclude duniter-end2end-tests --exclude duniter-live-tests test_fee --features fast" # Gtest tests with the production fee model
# `te` and `cucumber` are synonyms
te = "test -p duniter-end2end-tests --test cucumber_tests --features constant-fees,fast --"
cucumber-build = "build -p duniter --no-default-features --features gtest,distance-oracle,constant-fees,fast"
cucumber = "test -p duniter-end2end-tests --test cucumber_tests --features constant-fees,fast --"
ta = "test --workspace --exclude g1-runtime --exclude duniter-live-tests --features constant-fees,fast"
tb = "test --features runtime-benchmarks -p"
rbp = "run --release --features runtime-benchmarks -- benchmark pallet --chain=dev --steps=50 --repeat=20 --extrinsic=* --execution=wasm --wasm-execution=compiled --heap-pages=4096 --header=./file_header.txt --output=. --pallet"
xtask = "run --package xtask --"
cucumber-node = "run -p duniter --features constant-fees,fast -- --chain=gt_local --sealing=manual --force-authoring --rpc-cors=all --tmp --rpc-port 9944 --alice"
