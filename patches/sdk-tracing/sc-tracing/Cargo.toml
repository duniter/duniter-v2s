# Copied from SDK e2f5d44770e741d708b5ee551cf152afccee0b54.
# See ../README.md for the manifest changes and removal conditions.
[package]
name = "sc-tracing"
version = "45.0.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk.git"
description = "Instrumentation implementation for substrate."
readme = "README.md"


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "interest_cache_realistic"
harness = false

[[bench]]
name = "interest_cache_diverse"
harness = false

[[bench]]
name = "interest_cache_multithreaded"
harness = false

[dependencies]
chrono = { version = "0.4.31" }
codec = { version = "3.7.5", default-features = true, package = "parity-scale-codec" }
console = { version = "0.15.8" }
is-terminal = { version = "0.4.9" }
libc = { version = "0.2.155" }
log = { version = "0.4.22", default-features = true }
parking_lot = { version = "0.12.1", default-features = true }
rustc-hash = { version = "1.1.0" }
sc-client-api = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sc-tracing-proc-macro = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
serde = { version = "1.0.214", default-features = true }
sp-api = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sp-blockchain = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sp-core = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sp-rpc = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sp-runtime = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
sp-tracing = { default-features = true, git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3" }
thiserror = { version = "1.0.64" }
tracing = { version = "0.1.37", default-features = true }
tracing-log = { version = "0.2.0", features = ["interest-cache"] }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "parking_lot"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = true }
regex = { version = "1.10.2" }
tracing-subscriber = { version = "=0.3.20", features = ["chrono", "parking_lot"] }

[lints.rust]
suspicious_double_ref_op = { level = "allow", priority = 2 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(build_opt_level, values(\"3\"))", "cfg(build_profile, values(\"debug\", \"release\"))", "cfg(enable_alloc_error_handler)", "cfg(fuzzing)", "cfg(ignore_flaky_test)", "cfg(substrate_runtime)"] }

[lints.clippy]
all = { level = "allow", priority = 0 }
bind_instead_of_map = { level = "allow", priority = 2 }
borrowed-box = { level = "allow", priority = 2 }
complexity = { level = "warn", priority = 1 }
correctness = { level = "warn", priority = 1 }
default_constructed_unit_structs = { level = "allow", priority = 2 }
derivable_impls = { level = "allow", priority = 2 }
eq_op = { level = "allow", priority = 2 }
erasing_op = { level = "allow", priority = 2 }
extra-unused-type-parameters = { level = "allow", priority = 2 }
identity-op = { level = "allow", priority = 2 }
if-same-then-else = { level = "allow", priority = 2 }
needless-lifetimes = { level = "allow", priority = 2 }
needless_option_as_deref = { level = "allow", priority = 2 }
nonminimal-bool = { level = "allow", priority = 2 }
option-map-unit-fn = { level = "allow", priority = 2 }
stable_sort_primitive = { level = "allow", priority = 2 }
too-many-arguments = { level = "allow", priority = 2 }
type_complexity = { level = "allow", priority = 2 }
unit_arg = { level = "allow", priority = 2 }
unnecessary_cast = { level = "allow", priority = 2 }
useless_conversion = { level = "allow", priority = 2 }
while_immutable_condition = { level = "allow", priority = 2 }
zero-prefixed-literal = { level = "allow", priority = 2 }
